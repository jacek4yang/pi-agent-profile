[package]
name = "pi-profile"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Interactive, recoverable Pi Agent environment manager"
license = "MIT"
repository = "https://github.com/jacek4yang/pi-agent-profile"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
dunce = "1.0.5"
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
